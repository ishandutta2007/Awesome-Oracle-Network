<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="45%" stop-color="#0c1433" />
      <stop offset="80%" stop-color="#080e24" />
      <stop offset="100%" stop-color="#030611" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#6B11FF" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.06)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(0, 242, 254, 0.2)" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.06); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -100; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-2deg); }
    }
    @keyframes nodePing {
      0% { r: 4px; opacity: 1; }
      100% { r: 16px; opacity: 0; }
    }
    .pulsing-orb {
      animation: pulseGlow 4s ease-in-out infinite;
      transform-origin: center;
    }
    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dashStream 3s linear infinite;
    }
    .stream-fast {
      stroke-dasharray: 6, 6;
      animation: dashStream 1.8s linear infinite;
    }
    .floating-card-1 {
      animation: floatSlow 5s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-card-2 {
      animation: floatReverse 6s ease-in-out infinite;
      transform-origin: center;
    }
    .ping-circle {
      animation: nodePing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="180" r="130" fill="#6B11FF" opacity="0.25" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="1020" cy="160" r="150" fill="#00F2FE" opacity="0.22" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="600" cy="60" r="100" fill="#38ef7d" opacity="0.12" filter="url(#glow)" />

  <!-- Connection / Oracle Data Stream Network Lines -->
  <path d="M 80 280 Q 250 120 420 220 T 780 180 T 1120 120" fill="none" stroke="rgba(0, 242, 254, 0.4)" stroke-width="2" class="stream-line" />
  <path d="M 120 90 Q 340 290 600 140 T 1080 260" fill="none" stroke="rgba(107, 17, 255, 0.5)" stroke-width="2" class="stream-fast" />
  <path d="M 280 40 L 420 220 L 600 140 L 780 180 L 960 90" fill="none" stroke="rgba(56, 239, 125, 0.3)" stroke-width="1.5" stroke-dasharray="4, 4" />

  <!-- Oracle Network Nodes -->
  <g transform="translate(420, 220)">
    <circle class="ping-circle" cx="0" cy="0" r="4" fill="none" stroke="#00F2FE" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#00F2FE" filter="url(#glowSoft)" />
  </g>
  <g transform="translate(600, 140)">
    <circle class="ping-circle" cx="0" cy="0" r="4" fill="none" stroke="#38ef7d" stroke-width="2" style="animation-delay: 0.8s" />
    <circle cx="0" cy="0" r="7" fill="#38ef7d" filter="url(#glowSoft)" />
  </g>
  <g transform="translate(780, 180)">
    <circle class="ping-circle" cx="0" cy="0" r="4" fill="none" stroke="#9b51e0" stroke-width="2" style="animation-delay: 1.5s" />
    <circle cx="0" cy="0" r="6" fill="#9b51e0" filter="url(#glowSoft)" />
  </g>

  <!-- Left Interactive Floating Badge -->
  <g class="floating-card-1" transform="translate(90, 75)">
    <rect width="180" height="74" rx="12" fill="url(#cardGrad)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.2" />
    <circle cx="28" cy="37" r="14" fill="rgba(0, 242, 254, 0.15)" />
    <text x="28" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#00F2FE" text-anchor="middle" font-weight="bold">🔮</text>
    <text x="52" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8FA0DD" font-weight="600">PRICE FEEDS</text>
    <text x="52" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="bold">Sub-Second Pull</text>
  </g>

  <g class="floating-card-2" transform="translate(80, 190)">
    <rect width="180" height="74" rx="12" fill="url(#cardGrad)" stroke="rgba(107, 17, 255, 0.35)" stroke-width="1.2" />
    <circle cx="28" cy="37" r="14" fill="rgba(107, 17, 255, 0.2)" />
    <text x="28" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9b51e0" text-anchor="middle" font-weight="bold">⚡</text>
    <text x="52" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8FA0DD" font-weight="600">CROSS-CHAIN</text>
    <text x="52" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="bold">CCIP &amp; Bridges</text>
  </g>

  <!-- Right Interactive Floating Badges -->
  <g class="floating-card-2" transform="translate(930, 75)">
    <rect width="185" height="74" rx="12" fill="url(#cardGrad)" stroke="rgba(56, 239, 125, 0.3)" stroke-width="1.2" />
    <circle cx="28" cy="37" r="14" fill="rgba(56, 239, 125, 0.15)" />
    <text x="28" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#38ef7d" text-anchor="middle" font-weight="bold">🛡️</text>
    <text x="52" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8FA0DD" font-weight="600">DEFI SECURITY</text>
    <text x="52" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="bold">$50B+ TVS Protected</text>
  </g>

  <g class="floating-card-1" transform="translate(930, 190)">
    <rect width="185" height="74" rx="12" fill="url(#cardGrad)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.2" />
    <circle cx="28" cy="37" r="14" fill="rgba(0, 242, 254, 0.15)" />
    <text x="28" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#00F2FE" text-anchor="middle" font-weight="bold">🎲</text>
    <text x="52" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8FA0DD" font-weight="600">VERIFIABLE VRF</text>
    <text x="52" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="bold">Proof of Reserve</text>
  </g>

  <!-- Central Hero Header -->
  <g transform="translate(600, 110)">
    <!-- Subtitle Pill -->
    <rect x="-140" y="-45" width="280" height="28" rx="14" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <text x="0" y="-27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#00F2FE" text-anchor="middle" font-weight="bold" letter-spacing="2">🌐 PRODUCTION &amp; OPEN-SOURCE</text>

    <!-- Main Title -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
      Awesome Oracle Network
    </text>
    
    <!-- Title Glow Reflection -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#cyanBlueGrad)" text-anchor="middle" letter-spacing="-0.5" opacity="0.4" filter="url(#glowSoft)">
      Awesome Oracle Network
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#9FB3D9" text-anchor="middle" font-weight="500">
      Curated Decentralized Oracles, Real-World Data Feeds, VRF &amp; Cross-Chain Protocols
    </text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(0, 115)">
      <rect x="-240" y="-12" width="105" height="24" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255,255,255,0.12)" />
      <text x="-187" y="4" font-family="sans-serif" font-size="11" fill="#c3d2f0" text-anchor="middle" font-weight="600">⛓️ Data Feeds</text>

      <rect x="-120" y="-12" width="115" height="24" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255,255,255,0.12)" />
      <text x="-62" y="4" font-family="sans-serif" font-size="11" fill="#c3d2f0" text-anchor="middle" font-weight="600">⚡ Pull Oracles</text>

      <rect x="10" y="-12" width="105" height="24" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255,255,255,0.12)" />
      <text x="62" y="4" font-family="sans-serif" font-size="11" fill="#c3d2f0" text-anchor="middle" font-weight="600">🎲 VRF / PoR</text>

      <rect x="130" y="-12" width="110" height="24" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255,255,255,0.12)" />
      <text x="185" y="4" font-family="sans-serif" font-size="11" fill="#c3d2f0" text-anchor="middle" font-weight="600">🔄 Cross-Chain</text>
    </g>
  </g>
</svg>
